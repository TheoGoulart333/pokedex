<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pokédex em Python — versão Web</title>
<meta name="description" content="Pokédex interativa: busca na PokeAPI e cadastro local, inspirada no dispositivo clássico." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red: #D6362B;
    --red-dark: #9E2620;
    --red-shadow: #7A1B17;
    --screen-bg: #1E2A1E;
    --screen-text: #8FBF6F;
    --screen-text-dim: #4F6B47;
    --accent-blue: #3DA5D9;
    --cream: #F4EDE0;
    --charcoal: #241A18;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: #171010;
    color: var(--cream);
    font-family: 'Space Mono', monospace;
    min-height:100vh;
  }

  body{
    display:flex;
    justify-content:center;
    padding: 32px 16px 64px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  .device{
    width: 100%;
    max-width: 480px;
  }

  .brand{
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--red);
    text-align:center;
    margin-bottom: 14px;
    opacity: 0.9;
  }

  .shell{
    background: linear-gradient(180deg, var(--red) 0%, var(--red-dark) 100%);
    border-radius: 22px 22px 14px 14px;
    padding: 20px;
    box-shadow:
      0 30px 60px rgba(0,0,0,0.55),
      inset 0 2px 0 rgba(255,255,255,0.25),
      inset 0 -6px 0 rgba(0,0,0,0.2);
    position: relative;
    border: 2px solid var(--red-shadow);
  }

  .shell::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height: 6px;
    background: repeating-linear-gradient(90deg, rgba(0,0,0,0.15) 0 2px, transparent 2px 6px);
    border-radius: 22px 22px 0 0;
  }

  /* ---- lights row ---- */
  .lights{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 6px 4px 18px;
  }

  .big-light{
    width: 46px; height: 46px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #eaf7ff 0%, var(--accent-blue) 35%, #1c6d94 100%);
    box-shadow:
      0 0 0 4px var(--cream),
      0 0 0 7px var(--red-shadow),
      0 3px 6px rgba(0,0,0,0.4),
      0 0 18px rgba(61,165,217,0.55);
    position: relative;
    animation: blink-blue 3.2s ease-in-out infinite;
  }
  .big-light::after{
    content:"";
    position:absolute;
    top:6px; left:8px;
    width:12px; height:12px;
    border-radius:50%;
    background: rgba(255,255,255,0.85);
    filter: blur(1px);
  }
  @keyframes blink-blue{
    0%, 92%, 100% { filter:brightness(1); }
    94% { filter:brightness(1.7); }
  }

  .small-lights{ display:flex; gap:8px; margin-left: 4px; }
  .small-light{
    width: 12px; height:12px;
    border-radius:50%;
    box-shadow: 0 2px 3px rgba(0,0,0,0.4), inset 0 -2px 2px rgba(0,0,0,0.25);
  }
  .small-light.red{ background: #E4453A; }
  .small-light.yellow{ background: #EFC94C; }
  .small-light.green{ background: #6FCF6F; }

  /* ---- screen ---- */
  .screen-frame{
    background: var(--charcoal);
    border-radius: 10px;
    padding: 10px;
    box-shadow: inset 0 0 0 3px #100a09, inset 0 4px 10px rgba(0,0,0,0.6);
  }

  .screen{
    background: var(--screen-bg);
    border-radius: 4px;
    min-height: 260px;
    padding: 16px;
    position: relative;
    overflow: hidden;
    font-size: 13px;
    line-height: 1.55;
    color: var(--screen-text);
  }

  .screen::after{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.14) 0px,
      rgba(0,0,0,0.14) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
    mix-blend-mode: multiply;
  }

  .screen-content{ position:relative; z-index:1; }

  .screen h2{
    font-family:'Press Start 2P', monospace;
    font-size: 10px;
    margin: 0 0 10px;
    color: var(--screen-text);
    letter-spacing: 0.5px;
  }

  .readout-line{ display:flex; gap:6px; flex-wrap:wrap; }
  .readout-line b{ color: #C7E8AE; }

  .dim{ color: var(--screen-text-dim); }

  .sprite{
    image-rendering: pixelated;
    width: 96px; height:96px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--screen-text-dim);
    border-radius: 4px;
    display:block;
    margin: 4px 0 10px;
  }

  .empty-state{
    color: var(--screen-text-dim);
    font-size:12px;
  }

  .mon-card{
    border: 1px dashed var(--screen-text-dim);
    border-radius: 4px;
    padding: 8px 10px;
    margin-bottom: 8px;
  }
  .mon-card b{ color:#C7E8AE; text-transform: capitalize; }

  .blink-cursor{
    display:inline-block;
    width:8px; height:12px;
    background: var(--screen-text);
    animation: blink 1s steps(1) infinite;
    vertical-align: -2px;
    margin-left: 2px;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  /* ---- controls ---- */
  .controls{
    display:flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .tab-btn{
    flex: 1 1 auto;
    min-width: 80px;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    background: var(--red-dark);
    color: var(--cream);
    border: none;
    border-radius: 8px;
    padding: 11px 6px;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--red-shadow), 0 4px 6px rgba(0,0,0,0.3);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .tab-btn:hover{ filter: brightness(1.08); }
  .tab-btn:active{ transform: translateY(2px); box-shadow: 0 1px 0 var(--red-shadow); }
  .tab-btn.active{
    background: var(--accent-blue);
    color: #0c2733;
    box-shadow: 0 3px 0 #1c6d94, 0 4px 6px rgba(0,0,0,0.3);
  }

  /* ---- form area (below screen, inside shell) ---- */
  .panel{
    margin-top: 14px;
    background: rgba(0,0,0,0.18);
    border-radius: 8px;
    padding: 12px;
  }
  .panel.hidden{ display:none; }

  .field{
    display:flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 10px;
  }
  .field label{
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--cream);
    opacity: 0.85;
  }
  .field input{
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    padding: 9px 10px;
    border-radius: 6px;
    border: 2px solid var(--red-shadow);
    background: var(--cream);
    color: var(--charcoal);
  }
  .field input:focus{
    outline: 3px solid var(--accent-blue);
    outline-offset: 1px;
  }

  .primary-btn{
    width: 100%;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    background: var(--accent-blue);
    color: #0c2733;
    border: none;
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    box-shadow: 0 3px 0 #1c6d94;
  }
  .primary-btn:active{ transform: translateY(2px); box-shadow: none; }

  .status-msg{
    margin-top: 8px;
    font-size: 12px;
    color: var(--cream);
    min-height: 14px;
  }

  footer{
    text-align:center;
    margin-top: 18px;
    font-size: 11px;
    color: #8a7d78;
  }
  footer a{ color: var(--accent-blue); }

  @media (max-width: 380px){
    .tab-btn{ font-size: 10px; padding: 10px 4px; }
  }
</style>
</head>
<body>

<div class="device">
  <div class="brand">POKÉDEX // TERMINAL PORTÁTIL</div>

  <div class="shell">
    <div class="lights">
      <div class="big-light" aria-hidden="true"></div>
      <div class="small-lights" aria-hidden="true">
        <span class="small-light red"></span>
        <span class="small-light yellow"></span>
        <span class="small-light green"></span>
      </div>
    </div>

    <div class="screen-frame">
      <div class="screen">
        <div class="screen-content" id="screenContent">
          <h2>&gt; BEM-VINDO</h2>
          <p class="dim">Escolha uma opção abaixo para buscar na API, consultar seus Pokémon cadastrados ou adicionar um novo.<span class="blink-cursor"></span></p>
        </div>
      </div>
    </div>

    <div class="controls" role="tablist" aria-label="Modos da Pokédex">
      <button class="tab-btn active" data-tab="api">Buscar API</button>
      <button class="tab-btn" data-tab="local">Cadastrados</button>
      <button class="tab-btn" data-tab="add">Adicionar</button>
    </div>

    <!-- Buscar na API -->
    <div class="panel" id="panel-api">
      <div class="field">
        <label for="apiName">Nome do Pokémon</label>
        <input type="text" id="apiName" placeholder="ex: greninja" autocomplete="off">
      </div>
      <button class="primary-btn" id="apiSearchBtn">Consultar na PokeAPI</button>
      <div class="status-msg" id="apiStatus"></div>
    </div>

    <!-- Local -->
    <div class="panel hidden" id="panel-local">
      <div class="field">
        <label for="localName">Buscar pelo nome (opcional)</label>
        <input type="text" id="localName" placeholder="deixe vazio para listar todos" autocomplete="off">
      </div>
      <button class="primary-btn" id="localSearchBtn">Ver cadastrados</button>
    </div>

    <!-- Adicionar -->
    <div class="panel hidden" id="panel-add">
      <div class="field">
        <label for="addName">Nome</label>
        <input type="text" id="addName" placeholder="ex: Delphox">
      </div>
      <div class="field">
        <label for="addType">Tipo</label>
        <input type="text" id="addType" placeholder="ex: Fire/Psychic">
      </div>
      <div class="field">
        <label for="addHp">HP</label>
        <input type="number" id="addHp" placeholder="ex: 75">
      </div>
      <div class="field">
        <label for="addRegion">Região</label>
        <input type="text" id="addRegion" placeholder="ex: Kalos">
      </div>
      <button class="primary-btn" id="addBtn">Cadastrar Pokémon</button>
      <div class="status-msg" id="addStatus"></div>
    </div>
  </div>

  <footer>
    Baseado no projeto <strong>Pokédex em Python</strong> de Theo Vasconcelos.
  </footer>
</div>

<script>
(function(){
  const STORAGE_KEY = "pokedex_local_v1";

  const seed = {
    "Delphox":   { type: "Fire/Psychic",  hp: 75, region: "Kalos" },
    "Greninja":  { type: "Water/Dark",    hp: 72, region: "Kalos" },
    "Infernape": { type: "Fire/Fighting", hp: 76, region: "Sinnoh" }
  };

  function loadLocal(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return {...seed};
      const parsed = JSON.parse(raw);
      return (parsed && typeof parsed === "object") ? parsed : {...seed};
    }catch(e){
      return {...seed};
    }
  }

  function saveLocal(data){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch(e){ /* localStorage indisponível — segue só em memória */ }
  }

  let pokedex = loadLocal();

  const screenContent = document.getElementById("screenContent");
  const tabs = document.querySelectorAll(".tab-btn");
  const panels = {
    api: document.getElementById("panel-api"),
    local: document.getElementById("panel-local"),
    add: document.getElementById("panel-add")
  };

  function setScreen(html){
    screenContent.innerHTML = html;
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  tabs.forEach(btn => {
    btn.addEventListener("click", () => {
      tabs.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      Object.values(panels).forEach(p => p.classList.add("hidden"));
      panels[btn.dataset.tab].classList.remove("hidden");
    });
  });

  /* ---------- Buscar na API ---------- */
  const apiSearchBtn = document.getElementById("apiSearchBtn");
  const apiName = document.getElementById("apiName");
  const apiStatus = document.getElementById("apiStatus");

  async function buscarPokemonAPI(){
    const nome = apiName.value.trim().toLowerCase();
    if(!nome){
      apiStatus.textContent = "Digite um nome primeiro.";
      return;
    }
    apiStatus.textContent = "";
    setScreen(`<h2>&gt; CONSULTANDO...</h2><p class="dim">Acessando PokeAPI para "${escapeHtml(nome)}"<span class="blink-cursor"></span></p>`);

    try{
      const resp = await fetch(`https://pokeapi.co/api/v2/pokemon/${encodeURIComponent(nome)}`);
      if(!resp.ok){
        setScreen(`<h2>&gt; ERRO</h2><p class="dim">Pokémon não encontrado na API.</p>`);
        return;
      }
      const dados = await resp.json();
      const nomeCap = dados.name.charAt(0).toUpperCase() + dados.name.slice(1);
      const altura = (dados.height / 10).toFixed(1);
      const peso = (dados.weight / 10).toFixed(1);
      const tipos = dados.types.map(t => t.type.name).join(", ");
      const habilidades = dados.abilities.map(h => h.ability.name).join(", ");
      const sprite = dados.sprites && (dados.sprites.front_default || "");

      setScreen(`
        <h2>&gt; ${escapeHtml(nomeCap)}</h2>
        ${sprite ? `<img class="sprite" src="${sprite}" alt="Sprite de ${escapeHtml(nomeCap)}">` : ""}
        <div class="readout-line"><span class="dim">Altura:</span> <b>${altura} m</b></div>
        <div class="readout-line"><span class="dim">Peso:</span> <b>${peso} kg</b></div>
        <div class="readout-line"><span class="dim">Tipo:</span> <b>${escapeHtml(tipos)}</b></div>
        <div class="readout-line"><span class="dim">Habilidades:</span> <b>${escapeHtml(habilidades)}</b></div>
      `);
    }catch(e){
      setScreen(`<h2>&gt; ERRO DE CONEXÃO</h2><p class="dim">Não foi possível acessar a PokeAPI agora.</p>`);
    }
  }

  apiSearchBtn.addEventListener("click", buscarPokemonAPI);
  apiName.addEventListener("keydown", e => { if(e.key === "Enter") buscarPokemonAPI(); });

  /* ---------- Cadastrados (local) ---------- */
  const localSearchBtn = document.getElementById("localSearchBtn");
  const localName = document.getElementById("localName");

  function renderLocalList(filterName){
    const entries = Object.entries(pokedex);

    if(filterName){
      const key = Object.keys(pokedex).find(k => k.toLowerCase() === filterName.toLowerCase());
      if(!key){
        setScreen(`<h2>&gt; NÃO ENCONTRADO</h2><p class="dim">Nenhum Pokémon cadastrado com esse nome.</p>`);
        return;
      }
      const m = pokedex[key];
      setScreen(`
        <h2>&gt; ${escapeHtml(key)}</h2>
        <div class="readout-line"><span class="dim">Tipo:</span> <b>${escapeHtml(m.type)}</b></div>
        <div class="readout-line"><span class="dim">HP:</span> <b>${escapeHtml(m.hp)}</b></div>
        <div class="readout-line"><span class="dim">Região:</span> <b>${escapeHtml(m.region)}</b></div>
      `);
      return;
    }

    if(entries.length === 0){
      setScreen(`<h2>&gt; LISTA VAZIA</h2><p class="empty-state">Nenhum Pokémon cadastrado ainda.</p>`);
      return;
    }

    const cards = entries.map(([nome, m]) => `
      <div class="mon-card">
        <b>${escapeHtml(nome)}</b><br>
        <span class="dim">Tipo:</span> ${escapeHtml(m.type)} &nbsp;
        <span class="dim">HP:</span> ${escapeHtml(m.hp)} &nbsp;
        <span class="dim">Região:</span> ${escapeHtml(m.region)}
      </div>
    `).join("");

    setScreen(`<h2>&gt; CADASTRADOS (${entries.length})</h2>${cards}`);
  }

  localSearchBtn.addEventListener("click", () => renderLocalList(localName.value.trim()));
  localName.addEventListener("keydown", e => { if(e.key === "Enter") renderLocalList(localName.value.trim()); });

  /* ---------- Adicionar ---------- */
  const addBtn = document.getElementById("addBtn");
  const addStatus = document.getElementById("addStatus");
  const addName = document.getElementById("addName");
  const addType = document.getElementById("addType");
  const addHp = document.getElementById("addHp");
  const addRegion = document.getElementById("addRegion");

  addBtn.addEventListener("click", () => {
    const nome = addName.value.trim();
    const tipo = addType.value.trim();
    const hp = addHp.value.trim();
    const region = addRegion.value.trim();

    if(!nome || !tipo || !hp || !region){
      addStatus.textContent = "Preencha todos os campos.";
      return;
    }

    pokedex[nome] = { type: tipo, hp: Number(hp), region: region };
    saveLocal(pokedex);

    addStatus.textContent = `"${nome}" cadastrado com sucesso!`;
    addName.value = ""; addType.value = ""; addHp.value = ""; addRegion.value = "";

    setScreen(`
      <h2>&gt; POKÉMON SALVO</h2>
      <div class="readout-line"><span class="dim">Nome:</span> <b>${escapeHtml(nome)}</b></div>
      <div class="readout-line"><span class="dim">Tipo:</span> <b>${escapeHtml(tipo)}</b></div>
      <div class="readout-line"><span class="dim">HP:</span> <b>${escapeHtml(hp)}</b></div>
      <div class="readout-line"><span class="dim">Região:</span> <b>${escapeHtml(region)}</b></div>
      <p class="dim">Salvo no armazenamento local do navegador.</p>
    `);
  });

})();
</script>

</body>
</html>
